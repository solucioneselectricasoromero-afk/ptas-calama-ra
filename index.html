<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTAS Calama · Maqueta 3D con ladder en línea</title>
<style>
:root{--navy:#0c2f5c;--teal:#3dd6c6;--g:#16a34a;--r:#dc2626;--bg:#f4f7fb;--line:#d5deea}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#1f2937;background:#0c2f5c}
header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:20}
header .brand small{display:block;color:var(--teal);font-weight:bold;font-size:11px;letter-spacing:.5px}
header .brand b{font-size:18px}
header .sp{flex:1}
.pill{padding:5px 12px;border-radius:20px;font-weight:bold;font-size:12px}
.pill.run{background:var(--g)}.pill.stop{background:#475569}.pill.em{background:var(--r);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.5}}
#clock{font-family:Consolas,monospace;font-size:13px;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:6px}
#scene{position:fixed;top:56px;left:0;right:430px;bottom:0;background:#cfe3f2}
body.nopanel #scene{right:0}
#panel{position:fixed;top:56px;right:0;width:430px;bottom:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:10}
body.nopanel #panel{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg)}
.tab{flex:1;border:0;background:none;padding:11px 2px;font-weight:bold;font-size:11.5px;color:#475569;cursor:pointer;border-bottom:3px solid transparent}
.tab.act{color:var(--navy);border-bottom-color:var(--teal);background:#fff}
.pane{flex:1;overflow:auto;padding:10px 12px}
.fbbar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.fbb,.rxb,#rxsel button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 8px;font-size:11.5px;cursor:pointer;color:var(--navy);font-weight:bold}
.fbb.act,.rxb.act,#rxsel button.act{background:var(--navy);color:#fff;border-color:var(--navy)}
#fbname{font-weight:bold;color:var(--navy);margin:6px 0;font-size:13px}
#fbname::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--g);margin-right:6px;animation:bl 1.4s infinite}
.rung{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow-x:auto;background:#fbfdff}
.rung.on{border-color:#86efac;background:#f6fef9}
.rh{font-size:11.5px;padding:6px 8px;color:#334155;border-bottom:1px solid var(--line);background:rgba(241,245,249,.6)}
.rung svg{display:block}
.el:hover rect{fill:rgba(61,214,198,.12)}
.legend{font-size:11px;color:#64748b;margin:6px 0 8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--g);vertical-align:middle;margin:0 4px}
.legend i.b{border-top:2px dashed #5b7fb0}
.g{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:7px;cursor:pointer;background:#fff}
.gh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.gh b{color:var(--navy)}
.bar{position:relative;height:14px;background:#e2e8f0;border-radius:7px;margin:4px 0 14px}
.fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4f8fb8,#5fb3e0);border-radius:7px;transition:width .2s}
.bar.fl .fill{background:linear-gradient(90deg,#0891b2,#22d3ee)}
.mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:#64748b}
.mk span{position:absolute;top:21px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:bold;color:#64748b;white-space:nowrap}
.mk.on{background:var(--g)}.mk.on span{color:var(--g)}
.gn{font-size:11.5px;color:#64748b;margin-top:2px}.gn.on{color:var(--g);font-weight:bold}
.gsel{font-size:12px;margin-bottom:8px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#hud{position:fixed;top:68px;left:12px;width:300px;max-height:calc(100vh - 230px);background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;z-index:12;display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(12,47,92,.15)}
#hudT{padding:8px 10px;font-weight:bold;color:#fff;background:var(--navy);border-radius:10px 10px 0 0;cursor:pointer;font-size:13px}
#hudT::after{content:" ▾";float:right}#hud.min #hudT::after{content:" ▸"}
#hudBody{overflow:auto;padding:8px}#hud.min #hudBody{display:none}#hud.min #hudT{border-radius:10px}
#bottom{position:fixed;left:12px;right:442px;bottom:12px;z-index:12;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
body.nopanel #bottom{right:12px}
#cap{background:rgba(12,47,92,.92);color:#fff;border-radius:10px;padding:9px 14px;max-width:760px;pointer-events:auto}
#capT{font-weight:bold;color:var(--teal);font-size:14px}#capX{font-size:12.5px;line-height:1.4;margin-top:3px}
#ctrl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:auto}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:bold;font-size:13px;cursor:pointer;background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.start{background:var(--g);color:#fff}.btn.stop{background:#475569;color:#fff}.btn.ini{background:var(--navy);color:#fff;border:2px solid var(--teal)}
.btn.ini.act{background:var(--teal);color:var(--navy)}.btn.em{background:var(--r);color:#fff}.btn.em.act{animation:bl 1s infinite}
.btn.tg.act{background:var(--teal);color:var(--navy)}
#toasts{position:fixed;top:68px;right:442px;width:330px;z-index:15;display:flex;flex-direction:column;gap:6px}
body.nopanel #toasts{right:12px}
.toast{background:#fff;border-left:6px solid var(--g);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.2);transition:opacity .5s,transform .5s}
.toast.off{border-left-color:var(--r)}.toast small{color:#64748b;font-weight:bold}.toast.bye{opacity:0;transform:translateX(20px)}
.lg{border:1px solid var(--line);border-left:5px solid var(--g);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12px;cursor:pointer}
.lg.off{border-left-color:var(--r)}.lt{color:#64748b;font-size:11px;font-weight:bold}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}th{background:var(--bg);color:var(--navy)}
#vars tr[data-tag]{cursor:pointer}.v1{color:var(--g);font-weight:bold}.v0{color:#64748b}
.mb{margin-bottom:14px}.mb h4{margin:6px 0 2px;color:var(--navy)}h3{color:var(--navy);font-size:14px;margin:14px 0 6px}
.muted{color:#64748b;font-size:12px}.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px;font-size:12px;line-height:1.45}
#info{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(560px,94vw);max-height:80vh;overflow:auto;background:#fff;border-radius:12px;z-index:30;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:none}
#info.show{display:block;transform:translate(-50%,-50%)}#infoX{position:sticky;top:0;float:right;border:0;background:var(--navy);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--navy);z-index:50;font-size:16px;text-align:center;padding:20px}
@media (max-width:820px){
  #scene{right:0;bottom:44vh}
  #panel{top:auto;height:44vh;width:100%;border-left:0;border-top:2px solid var(--teal)}
  body.nopanel #scene{bottom:0}
  #bottom{right:12px;bottom:calc(44vh + 8px)}body.nopanel #bottom{bottom:12px}
  #toasts{right:8px;left:8px;width:auto;top:62px}
  #hud{display:none}
  #cap{padding:6px 10px}#capX{display:none}
  .btn{padding:8px 10px;font-size:12px}
  header .brand b{font-size:15px}#clock{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand"><small>SIEMENS · SIMATIC · TIA PORTAL</small><b>PTAS Calama · Maqueta 3D</b></div>
  <div class="sp"></div>
  <span id="clock">LOCAL.HOUR 11:00</span>
  <span id="status" class="pill stop">PLANTA DETENIDA</span>
</header>
<div id="scene"></div>
<div id="hud"><div id="hudT">Niveles y caudalímetros · umbrales del ladder</div><div id="hudBody"></div></div>
<div id="toasts"></div>
<div id="bottom">
  <div id="cap"><div id="capT"></div><div id="capX"></div></div>
  <div id="ctrl">
    <button class="btn" id="bPrev">◀ Anterior</button>
    <button class="btn start" id="bStart">START</button>
    <button class="btn stop" id="bStop">STOP</button>
    <button class="btn ini" id="bInicio">INICIO</button>
    <button class="btn" id="bNext">Siguiente ▶</button>
    <button class="btn em" id="bEm">Parada de emergencia</button>
    <button class="btn sm tg" id="bTP">TP-BT OFF</button><button class="btn sm tg" id="bTG">Automático general TG OFF</button>
    <button class="btn sm tg" data-sp="1">x1</button><button class="btn sm tg act" data-sp="2">x2</button><button class="btn sm tg" data-sp="4">x4</button>
    <button class="btn sm tg act" id="bFollow">Seguir acciones</button>
    <button class="btn sm tg act" id="bLbl">Etiquetas</button>
    <button class="btn sm" id="bPanel">Panel</button>
  </div>
</div>
<div id="panel">
  <div class="tabs">
    <button class="tab act" data-t="ladder">Ladder</button>
    <button class="tab" data-t="levels">Niveles</button>
    <button class="tab" data-t="log">Acciones</button>
    <button class="tab" data-t="energy">Energía</button>
    <button class="tab" data-t="vars">Variables</button>
    <button class="tab" data-t="maint">Mantenimiento</button>
  </div>
  <div class="pane" id="p-ladder">
    <div class="fbbar">
      <button class="fbb act" data-fb="FB1">TK-PEAS</button><button class="fbb" data-fb="FB2">TK-ECUALIZADOR</button>
      <button class="fbb" data-fb="FB3">TK-REACTOR</button><button class="fbb" data-fb="FB14">CLORADOR</button><button class="fbb" data-fb="FB13">AGUA-TRATADA</button>
    </div>
    <div id="rxsel" class="fbbar" style="display:none">Reactor: <button data-rx="1">1</button><button data-rx="2">2</button><button data-rx="3">3</button><button data-rx="4">4</button><button data-rx="5">5</button></div>
    <div id="fbname"></div>
    <div class="legend"><i></i>con energía (1) <i class="b"></i>sin energía (0) · toca un contacto o bobina para verlo en la maqueta</div>
    <div id="ladder"></div>
  </div>
  <div class="pane" id="p-levels" style="display:none"><div id="levels"></div></div>
  <div class="pane" id="p-log" style="display:none"><div id="log"></div></div>
  <div class="pane" id="p-energy" style="display:none"><div id="energy"></div></div>
  <div class="pane" id="p-vars" style="display:none"><div id="vars"></div></div>
  <div class="pane" id="p-maint" style="display:none"><div id="maint"></div></div>
</div>
<div id="info"><button id="infoX">Cerrar</button><div id="infoBody"></div></div>
<div id="loading">Cargando maqueta 3D…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== LÓGICA PLC (ladder ejecutable + proceso) =====================
// Los segmentos replican los bloques TK-PEAS [FB1], TK-ECUALIZADOR [FB2], TK-REACTOR-n [FB3..],
// CLORADOR-n [FB14..] y AGUA-TRATADA [FB13] del proyecto en TIA Portal.
var T = {};               // tabla de variables (tag -> valor)
var ADDR = {};            // tag -> dirección TIA
function rn(n, base) { return n === 1 ? base : base + "-R" + n; }

(function initTags() {
  var d = function (tag, addr, v) { T[tag] = v === undefined ? false : v; if (addr) ADDR[tag] = addr; };
  // PEAS
  d("START-PEAS", "%I0.0"); d("STOP-PEAS", "%I0.1"); d("P-Emergencia-PEAS", "%I0.2");
  d("RELE-Termico-BB1-Peas", "%I0.3"); d("RELE-Termico-BB2-Peas", "%I0.4");
  d("LSH-PEAS", "%I0.5"); d("LSL-PEAS", "%I0.6"); d("XV-PEAS-101", "%I0.7"); d("XV-PEAS-ECU-102", "%Q1.1");
  d("BBA-Peas-01", "%Q0.0"); d("BBA-Peas-02", "%Q0.1"); d("POWER-ON", "%M0.2"); d("BOMBA-PEAS-RUN", "%M");
  d("FIC-PEAS", "%IW100", 0); d("Nivel-PEAS", "", 12);
  // ECUALIZADOR
  d("START-Ecualizador", "%I1.1"); d("STOP-Ecualizador", "%I1.2"); d("P-Emergencia-ECU", "%I1.3");
  d("RELE-Termico-BB1-AIR-Ecu", "%I1.4"); d("RELE-Termico-BB2-AIR-Ecu", "%I1.5");
  d("Power-Ecu", "%M"); d("BBA-ECU-AIR-001", "%Q0.2"); d("BBA-ECU-AIR-002", "%Q0.3"); d("XV-ECU-AIR-202", "%Q1.2");
  d("LSH-ECU", "%I2.2"); d("LSL-ECU", "%I2.3"); d("Habilita-BBA-ECU", "%M");
  ["03", "04", "05", "06", "07"].forEach(function (k, i) { d("BBA-ECU-" + k, "%Q0." + (4 + i > 7 ? "" : 4 + i)); });
  ADDR["BBA-ECU-07"] = "%Q1.0";
  d("PIC-ECU-AIR", "%IW102", 0); d("Flujo-Ecu", "%IW98", 0); d("Fluido-1", "%MD312", 0); d("Nivel-ECU", "", 40);
  // REACTORES
  var lv0 = [35, 55, 25, 65, 45], cl0 = [0.4, 1.6, 0.2, 2.4, 0.8];
  var stIn = [["I3.1", "I3.2", "I3.3", "I3.4", "I3.5"], ["I3.6", "I3.7", "I4.0", "I4.1", "I4.2"], ["I4.3", "I4.4", "I4.5", "I4.6", "I4.7"],
    ["I5.0", "I5.1", "I5.2", "I5.3", "I5.4"], ["I5.5", "I5.6", "I5.7", "I6.0", "I6.1"]];
  var lic = ["%IW68", "%IW74", "%IW78", "%IW82", "%IW86"], clo = ["%IW88", "%IW90", "%IW92", "%IW94", "%IW96"];
  for (var n = 1; n <= 5; n++) {
    var a = stIn[n - 1];
    d("Start-Reactor-" + n, "%" + a[0]); d("STOP-Reactor-" + n, "%" + a[1]); d("P-Emergencia-Rec-" + n, "%" + a[2]);
    d("RELE-Termico-BB1-AIR-Reactor" + n, "%" + a[3]); d("RELE-Termico-BB2-AIR-Reactor" + n, "%" + a[4]);
    d("Power-R" + n, "%M"); d("XV-REACTOR-30" + n, "%Q1." + (2 + n));
    d(rn(n, "BBA-REACTOR-AIR-01"), n === 1 ? "%Q2.0" : "Por asignar"); d(rn(n, "BBA-REACTOR-AIR-02"), n === 1 ? "%Q2.1" : "Por asignar");
    d(rn(n, "BBA-Cloro-1"), n === 1 ? "%Q2.2" : "Por asignar"); d(rn(n, "BBA-Cloro-2"), n === 1 ? "%Q2.3" : "Por asignar");
    d("Dosifica-R" + n, "%M");
    d("Nivel-Reactor-" + n, lic[n - 1], lv0[n - 1]); d("Cloro-Reactor-0" + n, clo[n - 1], cl0[n - 1]);
    d("PIC-Reactor-" + n, "", 0);
    d("Habilita-xv-40" + n, "%M"); d("XV-TK-ACU-40" + n, n === 1 ? "%Q2.4" : "Por asignar");
  }
  // AGUA TRATADA
  var lsh = ["%I6.7", "%I7.2", "%I7.5", "%I8.0", "%I8.3"], lsl = ["%I7.1", "%I7.3", "%I7.6", "%I8.1", "%I8.4"], acc0 = [55, 40, 70, 30, 50];
  for (var m = 1; m <= 5; m++) { d("LSH-ACUMULADOR-" + m, lsh[m - 1]); d("LSL-ACUMULADOR-" + m, lsl[m - 1]); d("Nivel-ACU-" + m, "", acc0[m - 1]); }
  d("Start-Aguatratada", "%I6.2"); d("Stop-Aguatratada", "%I6.3"); d("P-Emergencia-AguaTratada", "%I6.4");
  d("RELE-Termico-BB1-Centrifuga", "%I6.5"); d("RELE-Termico-BB2-Centrifuga", "%I6.6");
  d("Power-AT", "%M"); d("Habilita-BBA-Centrifuga", "%M");
  d("AGUA-TRATADA-CENTRIFUGA-1", "%Q2.5"); d("AGUA-TRATADA-CENTRIFUGA-2", "%Q2.6"); d("XV-Cachimba", "%Q2.7");
  d("Camion", "", 0); d("Camion-Presente", "simulación"); d("Camion-Lleno", "simulación");
  // energía: TP-BT en la subestación y automático general del TG-PTAS (medidor aguas abajo)
  d("Q-TPBT", "TP-BT 4x400 A"); d("Q-General-TG", "TG 4x400 A Ir 340 A"); d("Tension-OK", "");
  d("V-TG", "", 0); d("I-TG", "", 0); d("P-TG", "", 0); d("kWh-TG", "", 18452.0);
  d("LOCAL.HOUR", "DB9", 11); d("LOCAL.MINUTE", "DB9", 0);
})();

// ---------- elementos ladder ----------
function NO(tag) { return { t: "NO", tag: tag }; }
function NC(tag) { return { t: "NC", tag: tag }; }
function CMP(tag, op, k) { return { t: "CMP", tag: tag, op: op, k: k }; }
function OR() { return { t: "OR", br: Array.prototype.slice.call(arguments) }; }
function marcha(start, stop, em, power) { return { title: "Marcha / parada del área (requiere tensión del TG-PTAS)", els: [OR([NO(start)], [NO(power)]), NC(stop), NC(em), NO("Tension-OK")], coil: [power] }; }

var FBS = [];
FBS.push({ id: "FB1", name: "TK-PEAS [FB1]", st: "peas", rungs: [
  marcha("START-PEAS", "STOP-PEAS", "P-Emergencia-PEAS", "POWER-ON"),
  { title: "Válvula de entrada: abierta mientras no se bombea, cierra con nivel alto", els: [NO("POWER-ON"), NC("BOMBA-PEAS-RUN"), NC("LSH-PEAS"), NC("LSH-ECU")], coil: ["XV-PEAS-101"] },
  { title: "Habilita bombeo: parte con LSH, para con LSL", els: [NO("POWER-ON"), OR([NO("LSH-PEAS")], [NO("BOMBA-PEAS-RUN")]), NC("LSL-PEAS"), NC("LSH-ECU")], coil: ["BOMBA-PEAS-RUN"] },
  { title: "Bomba 1 (alternancia por hora del PLC)", els: [NO("BOMBA-PEAS-RUN"), CMP("LOCAL.HOUR", "<", 12), NC("RELE-Termico-BB1-Peas")], coil: ["BBA-Peas-01"] },
  { title: "Bomba 2 (alternancia por hora del PLC)", els: [NO("BOMBA-PEAS-RUN"), CMP("LOCAL.HOUR", ">=", 12), NC("RELE-Termico-BB2-Peas")], coil: ["BBA-Peas-02"] },
  { title: "Válvula de paso PEAS a ecualizador", els: [OR([NO("BBA-Peas-01")], [NO("BBA-Peas-02")]), NC("LSH-ECU")], coil: ["XV-PEAS-ECU-102"] },
] });
FBS.push({ id: "FB2", name: "TK-ECUALIZADOR [FB2]", st: "ecu", rungs: [
  marcha("START-Ecualizador", "STOP-Ecualizador", "P-Emergencia-ECU", "Power-Ecu"),
  { title: "Soplador 1 (alternancia por hora)", els: [NO("Power-Ecu"), CMP("LOCAL.HOUR", "<", 12), NC("RELE-Termico-BB1-AIR-Ecu")], coil: ["BBA-ECU-AIR-001"] },
  { title: "Soplador 2 (alternancia por hora)", els: [NO("Power-Ecu"), CMP("LOCAL.HOUR", ">=", 12), NC("RELE-Termico-BB2-AIR-Ecu")], coil: ["BBA-ECU-AIR-002"] },
  { title: "Válvula de aire", els: [OR([NO("BBA-ECU-AIR-001")], [NO("BBA-ECU-AIR-002")])], coil: ["XV-ECU-AIR-202"] },
  { title: "Habilita bombas sumergibles: parte con LSH, para con LSL", els: [NO("Power-Ecu"), OR([NO("LSH-ECU")], [NO("Habilita-BBA-ECU")]), NC("LSL-ECU")], coil: ["Habilita-BBA-ECU"] },
  { title: "Bombas sumergibles 3 a 7 a la línea de reactores", els: [NO("Habilita-BBA-ECU")], coil: ["BBA-ECU-03", "BBA-ECU-04", "BBA-ECU-05", "BBA-ECU-06", "BBA-ECU-07"] },
] });
for (var n = 1; n <= 5; n++) {
  FBS.push({ id: "FB-R" + n, name: "TK-REACTOR-" + n + " [FB" + (2 + n) + "]", st: "rea", n: n, rungs: [
    marcha("Start-Reactor-" + n, "STOP-Reactor-" + n, "P-Emergencia-Rec-" + n, "Power-R" + n),
    { title: "Válvula de entrada: línea con fluido y nivel del reactor bajo 90 %", els: [NO("Power-R" + n), NO("Habilita-BBA-ECU"), CMP("Fluido-1", ">=", 80),

  [[-1.05, 0.5, 3.0], [1.05, 0.5, 3.0], [-1.05, 0.5, -1.6], [1.05, 0.5, -1.6], [-1.05, 0.5, -3.0], [1.05, 0.5, -3.0]].forEach(function (p) {
    var wh = add(cyl(0.5, 0.5, 0.35, DARK, 16), p[0], p[1], p[2], g); wh.rotation.z = Math.PI / 2;
  });
  // chorro de riego
  var N = 70, geo = new THREE.BufferGeometry(), arr = new Float32Array(N * 3), seed = [];
  for (var i = 0; i < N; i++) seed.push([Math.random() * 2 - 1, Math.random()]);
  geo.setAttribute("position", new THREE.BufferAttribute(arr, 3));
  var spray = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x9fd8ff, size: 0.18, transparent: true, opacity: 0.85 }));
  scene.add(spray);
  var tr = { n: n, g: g, s: n === 1 ? BAY_S - 0.5 : IRR_FROM + 30, level: n === 1 ? 10 : 80, state: n === 1 ? "a cargar" : "regando", wait: 0, spray: spray, sprayArr: arr, sprayGeo: geo, seed: seed, wetAcc: 0 };
  var lb = liveLabel(function () { return "Camión " + n + " · " + Math.round(tr.level) + " % · " + tr.state; }, { h: 0.5 }); add(lb, 0, 4.2, -0.9, g);
  pick(g, { kind: "camion", tag: "Camion-" + n, truck: tr }); reg("Camion-" + n, g);

}
var trucks = [makeTruck(1), makeTruck(2)];
// manchas de camino mojado que se secan
var wet = [], WETMAT = new THREE.MeshStandardMaterial({ color: 0x6b5638, transparent: true, opacity: 0.45, roughness: 0.4, depthWrite: false });
function wetMark(p, dir) {
  var m = wet.length < 260 ? add(new THREE.Mesh(new THREE.PlaneGeometry(4.6, 1.6), WETMAT.clone()), 0, 0, 0) : wet.shift().m;
  m.rotation.set(-Math.PI / 2, 0, Math.atan2(dir.x, dir.z)); m.position.set(p.x - dir.x * 4, 0.05, p.z - dir.z * 4); m.material.opacity = 0.5;
  wet.push({ m: m, age: 0 });

function evTruck(tr, txt, on) { callout("Camion-" + tr.n, txt, on); if (window.UI && UI.note) UI.note(txt, on); }
function updTrucks(dt) {
  var speed = 6.5 * SPEED, occupied = trucks.some(function (t) { return t.state === "cargando" || t.state === "lleno"; });
  T["Camion-Presente"] = false;
  trucks.forEach(function (tr, k) {
    var other = trucks[1 - k];
    var gapAhead = ((other.s - tr.s) % PLEN + PLEN) % PLEN;
    var mv = 0;
    if (tr.state === "cargando") {
      T["Camion-Presente"] = true; tr.level = T["Camion"];   // la planta llena el camión (FB13)
      if (tr.level >= 100) { tr.state = "lleno"; tr.wait = 0; evTruck(tr, "■ Camión " + tr.n + " lleno → Camion-Lleno = 1, se corta el agua", false); }
    } else if (tr.state === "lleno") {
      T["Camion-Presente"] = true; tr.wait += dt;
      if (tr.wait > 1.5) { tr.state = "a regar"; T["Camion"] = 0; }
    } else {
      var distBay = ((BAY_S - tr.s) % PLEN + PLEN) % PLEN;
      var wantsLoad = tr.level < 95;
      mv = speed * dt;
      if (gapAhead < 11 && gapAhead > 0) mv = Math.min(mv, Math.max(0, gapAhead - 10));
      if (wantsLoad && distBay < mv + 0.01) {

        else { mv = Math.max(0, distBay - 9); tr.state = "fila"; }

        tr.level = Math.max(0, tr.level - mv * 100 / (IRR_TO - IRR_FROM) * 1.1);

    var q = pathAt(tr.s); tr.g.position.copy(q.p); tr.g.rotation.y = Math.atan2(q.dir.x, q.dir.z);
    // chorro
    var spraying = tr.state === "regando" && mv > 0; tr.spray.visible = spraying;
    if (spraying) {
      for (var i = 0; i < tr.seed.length; i++) {
        var sd = tr.seed[i]; sd[1] = (sd[1] + dt * 2.2) % 1; var back = 3.9 + sd[1] * 1.6, side = sd[0] * (1.2 + sd[1] * 1.8);
        var ox = q.dir.x * -back + q.dir.z * side, oz = q.dir.z * -back - q.dir.x * side;

      }

    }
  });
  wet.forEach(function (w) { w.age += dt * SPEED; w.m.material.opacity = Math.max(0, 0.5 - w.age / 90); });
}
// ductos: color naranja cuando llevan energía
function updEnergy(dt) {
  screens.forEach(function (m) { m.material = T["Tension-OK"] ? SCR_ON : SCR_OFF; });
  ducts.forEach(function (d) { var on = d.cond(); d.g.children.forEach(function (m) { m.material = on ? XRAYON : XRAY; }); });
  tpLever.position.y = T["Q-TPBT"] ? 1.55 : 1.35; tpLever.rotation.z = T["Q-TPBT"] ? 0 : 0.5;
  tgLever.position.y = T["Q-General-TG"] ? 1.2 : 1.0; tgLever.rotation.z = T["Q-General-TG"] ? 0 : 0.5;
}

// ===================== animación de estados =====================
function syncVisual(dt) {

  lamps.forEach(function (l) { var c = l.cond(); l.m.material = c ? (l.onMat || ON) : (l.offMat || (l.onMat ? IDLE : OFF)); });
  valves.forEach(function (v) { v.act.material = T[v.tag] ? ON : OFF; });
  spinners.forEach(function (s) { if (s.cond()) s.m.rotation[s.ax] += dt * 14 * Math.min(SPEED, 2); });
  updFlows(dt); updBubbles(dt); updTrucks(dt); updEnergy(dt);

var frame = 0;

// ===================== cámara =====================
var cam = { pos: new V(40, 36, 50), tgt: new V(6, 0, 0), path: null, t: 0, dur: 0 };

var STATIONS = [

    txt: "PTAS del campamento BLH Calama: PEAS enterrado, ecualizador, 5 reactores con cloración, 5 tanques acumuladores y cachimba. Control con PLC S7-1200 y 4 ET 200SP en PROFINET." },

  { name: "Cloración – CLORADOR [FB14]", pos: [13, 7.5, -1.5], tgt: [9.2, 1.2, -7.5], fb: "FB-C1",

  { name: "TK Acumuladores", pos: [4, 13, 20], tgt: [-8, 1.8, -1.2], fb: "FB-C1",

  { name: "Agua tratada y cachimba – AGUA-TRATADA [FB13]", pos: [-14, 8, 22], tgt: [-23, 2, 9.6], fb: "FB13",
    txt: "Con LSH-ACUMULADOR-1 parten las bombas centrífugas (alternadas por hora) y se abre XV-Cachimba para cargar el camión aljibe. Paran con LSL-ACUMULADOR-1." },
  { name: "Camiones aljibe regando el camino", pos: [20, 16, 44], tgt: [10, 0, 22], fb: "FB13", follow: true,
    txt: "Cada camión entra a la cachimba (Camion-Presente = 1) y las centrífugas lo llenan. Al llenarse (Camion-Lleno = 1) se corta el agua, el camión sale a regar el camino perimetral y, cuando se le acaba el agua, vuelve a cargar." },
  { name: "Tableros y red PROFINET", pos: [26, 5, 20], tgt: [RX1 + 6.4, 1.3, 11], fb: null,

var curSt = 0;
function goStation(i) {
  curSt = (i + STATIONS.length) % STATIONS.length; var s = STATIONS[curSt];
  var to = new V().fromArray(s.pos), tt = new V().fromArray(s.tgt);
  var P = [cam.pos.clone()], Tg = [cam.tgt.clone()];
  if (inWell(cam.pos) && !s.well) { P.push(new V().fromArray(PITTOP)); Tg.push(new V(PX, 3, PZ - 3)); P.push(new V().fromArray(PITHIGH)); Tg.push(new V(PX - 4, 1, PZ - 6)); }
  if (s.well && !inWell(cam.pos)) { P.push(new V().fromArray(PITHIGH)); Tg.push(new V(PX, -2, PZ)); P.push(new V().fromArray(PITTOP)); Tg.push(new V(PX, PY, PZ)); }
  P.push(to); Tg.push(tt);
  cam.path = { P: P, Tg: Tg }; cam.t = 0; cam.dur = 1.6 + (P.length - 2) * 1.3;
  UI.station(s);
}

function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function lerpPath(arr, t) { var n = arr.length - 1, f = t * n, i = Math.min(n - 1, Math.floor(f)); return new V().lerpVectors(arr[i], arr[i + 1], f - i); }
function updCam(dt) {
  if (cam.path) {
    cam.t += dt / cam.dur; var e = ease(Math.min(1, cam.t));
    cam.pos.copy(lerpPath(cam.path.P, e)); cam.tgt.copy(lerpPath(cam.path.Tg, e));
    if (cam.t >= 1) cam.path = null;
  }
  setCam();
}
// control manual: arrastrar = girar, rueda / pellizco = zoom
var drag = null, pinch = null;
function orbit(dx, dy) {
  var off = new V().subVectors(cam.pos, cam.tgt), r = off.length();
  var th = Math.atan2(off.x, off.z) - dx * 0.006, ph = Math.acos(Math.max(-1, Math.min(1, off.y / r))) - dy * 0.006;
  var under = cam.tgt.y < 0; ph = Math.max(0.15, Math.min(under ? 2.6 : 1.5, ph));
  off.set(r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph), r * Math.sin(ph) * Math.cos(th)); cam.pos.copy(cam.tgt).add(off);
}
function zoom(f) {
  var off = new V().subVectors(cam.pos, cam.tgt), r = off.length() * f;
  var lim = cam.tgt.y < 0 ? [0.8, 2.4] : [3, 140]; r = Math.max(lim[0], Math.min(lim[1], r));
  cam.pos.copy(cam.tgt).add(off.setLength(r));
}
var cvs = renderer.domElement, down = null;
cvs.addEventListener("pointerdown", function (e) { drag = { x: e.clientX, y: e.clientY }; down = { x: e.clientX, y: e.clientY, t: Date.now() }; cam.path = null; UI.stopTour(); });
window.addEventListener("pointermove", function (e) { if (!drag || pinch) return; orbit(e.clientX - drag.x, e.clientY - drag.y); drag = { x: e.clientX, y: e.clientY }; });
window.addEventListener("pointerup", function (e) {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && Date.now() - down.t < 400) doPick(e);
  drag = null; down = null;
});
cvs.addEventListener("wheel", function (e) { e.preventDefault(); zoom(e.deltaY > 0 ? 1.1 : 0.9); }, { passive: false });
cvs.addEventListener("touchstart", function (e) { if (e.touches.length === 2) { pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } }, { passive: true });
cvs.addEventListener("touchmove", function (e) {
  if (e.touches.length === 2 && pinch) { var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); zoom(pinch / d); pinch = d; }
}, { passive: true });
cvs.addEventListener("touchend", function (e) { if (e.touches.length < 2) pinch = null; }, { passive: true });
var ray = new THREE.Raycaster(), mv = new THREE.Vector2();
function doPick(e) {
  var r = cvs.getBoundingClientRect(); mv.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mv, camera); var hit = ray.intersectObjects(pickables, false)[0];
  if (hit) UI.info(hit.object.userData.info);
}

// ===================== resaltar equipos accionados por el ladder =====================
var rings = [];
var RINGMAT = new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.9, depthTest: false });
var RINGMAT2 = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.9, depthTest: false });
function highlight(tag, on) {
  var o = TAGOBJ[tag]; if (!o) return;
  var p = new V(); o.getWorldPosition(p);
  var m = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.07, 8, 40), (on ? RINGMAT : RINGMAT2).clone());
  m.position.copy(p).add(new V(0, 0.6, 0)); m.rotation.x = Math.PI / 2; m.renderOrder = 999; scene.add(m);
  rings.push({ m: m, t: 0 });
}
var callouts = [];
function callout(tag, text, on) {
  var o = TAGOBJ[tag]; if (!o) return; var p = new V(); o.getWorldPosition(p);
  var sp = label(text, { h: 0.5, bg: on ? "rgba(22,163,74,0.95)" : "rgba(220,38,38,0.95)" });
  sp.material.depthTest = false; sp.renderOrder = 1000;
  var y0 = p.y + (o.isMesh ? 0.9 : 2.6) + callouts.filter(function (c) { return c.tag === tag; }).length * 0.6;
  sp.position.set(p.x, y0, p.z); scene.add(sp); callouts.push({ s: sp, t: 0, y0: y0, tag: tag });
}
function updCallouts(dt) {
  for (var i = callouts.length - 1; i >= 0; i--) {
    var c = callouts[i]; c.t += dt; c.s.position.y = c.y0 + c.t * 0.25;
    c.s.material.opacity = c.t < 3.2 ? 1 : Math.max(0, 1 - (c.t - 3.2) / 0.8);
    if (c.t > 4) { scene.remove(c.s); c.s.material.map.dispose(); callouts.splice(i, 1); }
  }
}
function updRings(dt) {
  updCallouts(dt);
  for (var i = rings.length - 1; i >= 0; i--) {

    if (k >= 1) { scene.remove(r.m); r.m.geometry.dispose(); rings.splice(i, 1); }
  }
}
function focusTag(tag) {
  var o = TAGOBJ[tag]; if (!o) return false; var p = new V(); o.getWorldPosition(p);
  var to, tt = p.clone().add(new V(0, 0.6, 0));
  if (p.y < -0.5 && inPitXZ(p)) { to = new V().fromArray(PITCAM); }
  else to = p.clone().add(new V(3.5, 3.2, 6));
  var P = [cam.pos.clone()], Tg = [cam.tgt.clone()];
  var inside = to.y < 0;
  if (inWell(cam.pos) && !inside) { P.push(new V().fromArray(PITTOP)); Tg.push(new V(PX, 3, PZ - 3)); }
  if (inside && !inWell(cam.pos)) { P.push(new V().fromArray(PITHIGH)); Tg.push(new V(PX, -2, PZ)); P.push(new V().fromArray(PITTOP)); Tg.push(new V(PX, PY, PZ)); }
  P.push(to); Tg.push(tt); cam.path = { P: P, Tg: Tg }; cam.t = 0; cam.dur = 1.2 + (P.length - 2) * 1.2;
  highlight(tag, true); return true;
}

// ===================== bucle =====================
function resize() { var w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener("resize", resize); resize();
var last = performance.now();
function loop(now) {
  var dt = Math.min(0.1, (now - last) / 1000); last = now;
  step(dt); syncVisual(dt); updRings(dt); updCam(dt); UI.tick(dt);
  renderer.render(scene, camera); requestAnimationFrame(loop);
}
setCam();
window.SCENE = { goStation: goStation, highlight: highlight, callout: callout, focusTag: focusTag, hasTag: function (t) { return !!TAGOBJ[t]; }, STATIONS: STATIONS, labels: function (v) { scene.traverse(function (o) { if (o.userData.isLabel) o.visible = v; }); } };
requestAnimationFrame(loop);
})();
document.getElementById("loading").remove(); UI.init(); }
