<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PTAS Calama RA</title>
<style>
/* VOICE: sala de control, clara y técnica, como un panel WinCC.

   PICTURE: la planta 3D a pantalla completa; el HMI es un panel lateral o una bandeja inferior.
   COLOUR and TYPE: azul SIMATIC #0b2f5b, turquesa de botones #3fd6c6, verde marcha, rojo parada; Inter Tight + Inter.
   LAYOUT: lienzo completo, HMI a la derecha sobre 900px, bandeja inferior en teléfono, ficha del recorrido arriba a la izquierda. */
:root{color-scheme:light dark;--bg:light-dark(#dfe5ea,#14181c);--ink:#0e1a26;--hmi:#0b2f5b;--btn:#3fd6c6;--ok:#22b14c;--bad:#e8251a;--panel:#e9edf0}

*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.hmi{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:340px;max-height:calc(100% - 28px);overflow:auto;background:var(--panel);border:3px solid #1b1f24;border-radius:10px;box-shadow:0 12px 40px #0006;color:#0e1a26}
.hd{background:var(--hmi);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd b{font:700 15px "Inter Tight",Inter,sans-serif;color:#3fd6c6;letter-spacing:.02em}
.hd small{display:block;font-size:12px;opacity:.85}
.hd .t{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.st{margin:10px 12px 0;padding:8px 10px;border-radius:6px;font:700 14px "Inter Tight",sans-serif;text-align:center;color:#fff;background:#5d6670;transition:background .3s}
.st.on{background:var(--ok)}.st.seq{background:#e6a100}
.cmd{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:10px 12px}
button{font:700 14px "Inter Tight",Inter,sans-serif;min-height:44px;border-radius:6px;border:2px solid #1b1f24;cursor:pointer;color:#0e1a26;background:var(--btn);box-shadow:inset 0 -3px 0 #0003}
button:active{transform:translateY(1px);box-shadow:none}
button:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}
#bStart{background:var(--ok);color:#fff}#bAR{background:#0b2f5b;color:#fff;font-size:12.5px;line-height:1.1}#bStop{background:var(--bad);color:#fff}
.nav{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.nav button{flex:1 1 90px;min-height:38px;font-size:12px}
.rd{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 10px}
.rd div{background:#fff;border:1px solid #b9c2ca;border-radius:5px;padding:5px 8px}
.rd span{display:block;font-size:11px;color:#4a5560}
.rd b{font:700 17px "Inter Tight",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq{padding:0 12px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px}
.eq i{font:600 10.5px Inter,sans-serif;font-style:normal;text-align:center;padding:4px 2px;border-radius:4px;background:#c9d0d6;color:#33404c;white-space:nowrap}
.eq i.on{background:var(--ok);color:#fff}.eq i.sb{background:#f2c94c;color:#3a2c00}
.log{margin:0 12px 12px;background:#0e1a26;color:#9ef0c4;font:12px/1.5 ui-monospace,monospace;border-radius:5px;padding:6px 8px;height:82px;overflow:hidden}

.tour.show{display:block}
.tour .n{font:600 12px Inter,sans-serif;color:#3fd6c6}
.tour h2{font:700 22px/1.1 "Inter Tight",sans-serif;margin:4px 0 6px;text-wrap:balance}
.tour p{margin:0 0 6px;font-size:14.5px}
.tour ul{margin:0 0 8px;padding-left:18px;font-size:13.5px}
.tour .bar{height:4px;background:#ffffff33;border-radius:2px;overflow:hidden;margin:8px 0}
.tour .bar i{display:block;height:100%;width:0;background:#3fd6c6}
.tour .bt{display:flex;gap:8px}.tour .bt button{flex:1;min-height:40px;font-size:13px}
.msg{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#0e1a26ee;color:#fff;padding:10px 14px;border-radius:8px;max-width:min(520px,90vw);display:none;font-size:14px;text-align:center}
.msg.show{display:block}
.brand{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));font:600 12px Inter,sans-serif;color:#33404c;background:#ffffffcc;padding:6px 10px;border-radius:6px}
#exitAR{display:none;position:absolute;left:14px;top:14px;background:#1b1f24;color:#fff}
.min{display:none}
@media(max-width:900px){
 .hmi{left:8px;right:8px;top:auto;bottom:max(8px,env(safe-area-inset-bottom));width:auto;max-height:48%}
 .hmi.fold .x{display:none}
 .min{display:inline-block;min-height:32px;font-size:12px;padding:0 10px;background:#ffffff22;color:#fff;border-color:#ffffff55}
 .tour{width:auto;right:8px;left:8px;top:max(8px,env(safe-area-inset-top));padding:10px 12px}
 .tour h2{font-size:18px}.tour ul{display:none}
 .brand{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const BB = []; for (let k = 0; k < NB; k++) { const ecu = k < 140; const ri = k % 5; BB.push({ ecu, ri, x: ecu ? ex + (Math.random() - .5) * 4.4 : -9 + Math.random() * 18 * .6, z: ecu ? ez + (Math.random() - .5) * 9 : RZ[ri] + (Math.random() - .5) * 3.2, y: Math.random() * 2.2, s: .6 + Math.random() * .9 }); }
// marcador del recorrido
const ring = new THREE.Mesh(new THREE.RingGeometry(.94, 1, 64), new THREE.MeshBasicMaterial({ color: 0x3fd6c6, side: THREE.DoubleSide, transparent: true, opacity: .9, depthWrite: false })); ring.rotation.x = -Math.PI / 2; ring.visible = false; P.add(ring);
const arrow = new THREE.Mesh(new THREE.ConeGeometry(.9, 1.8, 4), new THREE.MeshBasicMaterial({ color: 0x3fd6c6 })); arrow.rotation.x = Math.PI; arrow.visible = false; P.add(arrow);
// ---------- HMI
const STN = [
 { id: "peas", nm: "PEAS", c: [21, 1, 11], r: 5, cam: [33, 14, 24] },
 { id: "ecu", nm: "ECUALIZADOR", c: [16, 1.5, -3], r: 6.5, cam: [30, 16, 8] },
 { id: "rea", nm: "REACTORES", c: [0, 1.5, 0], r: 13, cam: [10, 26, 30] },
 { id: "tk", nm: "TK ACUMUL.", c: [-21, 2, 0], r: 11, cam: [-8, 22, 30] },
 { id: "cach", nm: "CACHIMBA", c: [-34, 1, 14.5], r: 5, cam: [-24, 12, 28] },
 { id: "tg", nm: "TABLERO / PLC", c: [12.5, 1, -14], r: 3, cam: [22, 10, -26] }];
$("nav").innerHTML = STN.map((s, i) => `<button data-i="${i}">${s.nm}</button>`).join("");
$("eq").innerHTML = EQ.map((e, i) => `<i id="e${i}" title="${e.desc}">${e.tag.replace("_", " ").replace("_", " ")}</i>`).join("");
const log = []; function L(t) { const d = new Date(); log.unshift(d.toTimeString().slice(0, 8) + "  " + t); log.length = 5; $("log").innerHTML = log.join("<br>"); }
let run = false, starting = false, timers = [];
function setEq(e, on) { e.on = on; const i = EQ.indexOf(e); e.lamp.material.color.set(on ? 0x22ff55 : 0x8a1010); e.lamp.material.emissive.set(on ? 0x11aa33 : 0x300000); $("e" + i).className = on ? "on" : e.sb ? "sb" : ""; }
EQ.forEach(e => setEq(e, false));
function status() { const st = $("st"); st.className = "st" + (run ? " on" : starting ? " seq" : ""); st.textContent = run ? "PLANTA EN MARCHA · AUTOMÁTICO" : starting ? "SECUENCIA DE ARRANQUE…" : "PLANTA DETENIDA"; }
function start() {
  if (run || starting) return; starting = true; status(); L("START: secuencia de arranque desde HMI");
  const seq = [["peas", "PEAS: bomba BBA-001 en servicio, BBA-002 en alternancia"], ["ecu", "Ecualizador: sopladores SO-601/602 y bombas BBA-003…007"], ["rea", "Reactores 1 a 5: sopladores A, dosificadoras y extractores"], ["tk", "TK acumuladores recibiendo agua tratada"], ["cach", "Cachimba: BC-101 impulsando agua de reúso"]];
  seq.forEach(([st, t], k) => timers.push(setTimeout(() => { EQ.filter(e => e.st === st && !e.sb).forEach(e => setEq(e, true)); active.add(st); L(t); if (k === seq.length - 1) { run = true; starting = false; status(); L("Planta en régimen: Q ≈ 10 m³/h (240 m³/d)"); } }, 900 + k * 1300)));
}
function stop() { timers.forEach(clearTimeout); timers = []; run = starting = false; active.clear(); EQ.forEach(e => setEq(e, false)); status(); L("STOP: parada de todos los equipos"); }
const active = new Set();
$("bStart").onclick = start; $("bStop").onclick = () => { endTour(); stop(); };
// ---------- recorrido
const TOUR = [
 { s: 0, h: "PEAS: llegada de aguas servidas", p: "El agua servida del campamento llega por gravedad a la planta elevadora (PEAS), un estanque semienterrado.", l: ["Bombas sumergibles BBA-001 y BBA-002 en alternancia", "Partida y parada por nivel LSH/LSL-101", "FIT-101 mide el caudal de entrada"] },
 { s: 1, h: "Ecualizador: caudal y carga parejos", p: "El ecualizador amortigua las puntas de caudal para alimentar los reactores de forma constante.", l: ["Sopladores SO-601/602 mezclan y evitan malos olores", "BBA-003 a 007 alimentan un reactor cada una", "Nivel LSH/LSL-151 protege las bombas"] },
 { s: 2, h: "Reactores 1 a 5: lodos activados", p: "Las bacterias degradan la materia orgánica con el aire de los sopladores; luego el agua sedimenta y se desinfecta.", l: ["Sopladores SO-A/SO-B por reactor, uno de respaldo", "Dosificadoras BD-A/B inyectan hipoclorito", "Extractor EX ventila cada módulo"] },
 { s: 3, h: "TK acumuladores: agua tratada", p: "El agua clarificada y desinfectada se almacena en los cinco estanques acumuladores.", l: ["Tiempo de contacto para el cloro", "Reserva para humectación de caminos", "Rebalse controlado hacia la cachimba"] },
 { s: 4, h: "Cachimba: impulsión para reúso", p: "Las bombas centrífugas cargan los camiones aljibe con agua tratada para humectar caminos.", l: ["BC-101 y BC-102 en alternancia", "FIT-401 mide el caudal de salida", "Cerca del 80 % del agua se reutiliza"] },
 { s: 5, h: "Tablero general y control", p: "El TG-PTAS alimenta los tableros de fuerza y control. Un PLC S7-1200 con cuatro ET 200SP en red PROFINET comanda la planta.", l: ["CPU 1214C · switch SCALANCE XB005", "SCADA WinCC y estación de ingeniería", "Transformador 300 kVA, 23/0,4 kV"] }];
let ti = -1, tT = 0, tourOn = false; const TD = 9;
function showStep(i) { ti = (i + TOUR.length) % TOUR.length; tT = 0; const t = TOUR[ti], s = STN[t.s]; $("tN").textContent = `Recorrido · estación ${ti + 1} de ${TOUR.length}`; $("tH").textContent = t.h; $("tP").textContent = t.p; $("tL").innerHTML = t.l.map(x => `<li>${x}</li>`).join(""); focus(s); }
function focus(s) { ring.visible = arrow.visible = true; ring.position.set(s.c[0], .25, s.c[2]); ring.scale.setScalar(s.r); const ay = s.c[1] + Math.min(7.5, 3 + s.r * .45); arrow.position.set(s.c[0], ay, s.c[2]); arrow.userData.y = ay; if (!xr && !camMode) fly(s.cam, s.c, s.r); }
function tour() { tourOn = true; $("tour").classList.add("show"); if (!run && !starting) start(); L("INICIO: recorrido guiado por estaciones"); showStep(0); }
function endTour() { if (!tourOn) return; tourOn = false; $("tour").classList.remove("show"); ring.visible = arrow.visible = false; if (!xr && !camMode) fly(...HOME); }
$("bTour").onclick = tour; $("tNext").onclick = () => showStep(ti + 1); $("tPrev").onclick = () => showStep(ti - 1); $("tEnd").onclick = endTour;
$("nav").onclick = e => { const b = e.target.closest("button"); if (!b) return; endTour(); focus(STN[+b.dataset.i]); };
$("bFold").onclick = () => { $("hmi").classList.toggle("fold"); $("bFold").textContent = $("hmi").classList.contains("fold") ? "▴" : "▾"; resize(); };
let fl = null; const HOME = [[30, 34, 46], [-2, 0, 0]];
function kAsp() { return Math.max(1, 1.0 / cam.aspect); }
function fly(p, t, r = 30) { const tb = new THREE.Vector3(...t), b = new THREE.Vector3(...p).sub(tb).multiplyScalar(r > 20 ? kAsp() : Math.sqrt(kAsp())).add(tb); fl = { a: cam.position.clone(), b, ta: ctl.target.clone(), tb, k: 0 }; }
function msg(t, ms = 6000) { const m = $("msg"); m.textContent = t; m.classList.add("show"); clearTimeout(msg.h); msg.h = setTimeout(() => m.classList.remove("show"), ms); }
// ---------- realidad aumentada
let xr = null, camMode = false, hitSrc = null, placed = false; const reticle = new THREE.Mesh(new THREE.RingGeometry(.08, .1, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x3fd6c6 })); reticle.matrixAutoUpdate = false; reticle.visible = false; S.add(reticle);
const inFrame = (() => { try { return window.top !== window.self; } catch { return true; } })();
async function ar() {
  if (navigator.xr && await navigator.xr.isSessionSupported("immersive-ar").catch(() => false)) {
    try {
      const s = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ["hit-test"], optionalFeatures: ["dom-overlay"], domOverlay: { root: $("ui") } });
      xr = s; R.xr.enabled = true; R.xr.setReferenceSpaceType("local"); await R.xr.setSession(s); S.background = null; R.shadowMap.enabled = false;
      P.scale.setScalar(.02); P.visible = false; placed = false; $("exitAR").style.display = "block";
      const vs = await s.requestReferenceSpace("viewer"); hitSrc = await s.requestHitTestSource({ space: vs });
      $("ui").addEventListener("beforexrselect", e => e.preventDefault());
      s.addEventListener("select", () => { if (reticle.visible) { P.position.setFromMatrixPosition(reticle.matrix); P.visible = true; placed = true; msg("Planta ubicada. Usa START, STOP o INICIO en el HMI.", 4000); } });
      s.addEventListener("end", () => { xr = null; hitSrc = null; R.xr.enabled = false; S.background = SKY; R.shadowMap.enabled = true; P.scale.setScalar(1); P.position.set(0, 0, 0); P.visible = true; reticle.visible = false; $("exitAR").style.display = "none"; resize(); });
      msg("Mueve el teléfono apuntando al piso o a una mesa y toca la pantalla para ubicar la planta."); return;
    } catch (e) { }
  }
  if (!inFrame && navigator.mediaDevices?.getUserMedia) {
    try { const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); const v = $("cam"); v.srcObject = st; v.style.display = "block"; camMode = true; S.background = null; $("exitAR").style.display = "block"; fly(...HOME); msg("Modo cámara: la planta se superpone a lo que ves. Arrastra para girarla, pellizca para acercar."); return; } catch (e) { msg("No se pudo abrir la cámara: revisa el permiso del navegador."); return; }
  }
  msg("Aquí la página corre dentro de un marco que no permite usar la cámara: se muestra en 3D. Para la RA, abre la versión publicada en tu propio sitio desde el teléfono, escaneando el QR.", 9000);
}
$("bAR").onclick = ar;
$("exitAR").onclick = () => { if (xr) xr.end(); if (camMode) { const v = $("cam"); v.srcObject?.getTracks().forEach(t => t.stop()); v.style.display = "none"; camMode = false; S.background = SKY; $("exitAR").style.display = "none"; } };
// ---------- bucle
function resize() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; const hm = $("hmi"); if (w <= 900 && !xr) { const off = Math.round(Math.min(hm.offsetHeight, h * .5) / 2); cam.setViewOffset(w, h, 0, off, w, h); } else cam.clearViewOffset(); cam.updateProjectionMatrix(); }
addEventListener("resize", resize); if (innerWidth <= 900) { $("hmi").classList.add("fold"); $("bFold").textContent = "▴"; } resize();
{ const tb = new THREE.Vector3(...HOME[1]); cam.position.set(...HOME[0]).sub(tb).multiplyScalar(kAsp()).add(tb); ctl.target.copy(tb); }
const clk = new THREE.Clock(); const dm = new THREE.Object3D(); let flowT = 0, q1 = 0;
R.setAnimationLoop((ts, frame) => {
  const dt = Math.min(clk.getDelta(), .05), t = clk.elapsedTime;
  if (frame && hitSrc && !placed) { const hs = frame.getHitTestResults(hitSrc); if (hs.length) { const pose = hs[0].getPose(R.xr.getReferenceSpace()); reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix); } else reticle.visible = false; } else if (placed) reticle.visible = false;
  if (fl) { fl.k = Math.min(1, fl.k + dt / 1.6); const e = fl.k < .5 ? 2 * fl.k * fl.k : 1 - (-2 * fl.k + 2) ** 2 / 2; cam.position.lerpVectors(fl.a, fl.b, e); ctl.target.lerpVectors(fl.ta, fl.tb, e); if (fl.k >= 1) fl = null; }
  if (!xr) ctl.update();
  EQ.forEach(e => { if (e.on) e.rot.rotation.x += dt * 14; });
  if (active.size) flowT += dt * 3.2;
  DP.forEach((d, k) => { const p = PATHS[d.pi]; const on = active.has(p.st); if (on) dm.position.copy(at(p, d.o + flowT)); else dm.position.set(0, -50, 0); dm.scale.setScalar(on ? 1 : 0); dm.updateMatrix(); drops.setMatrixAt(k, dm.matrix); });
  drops.instanceMatrix.needsUpdate = true;
  BB.forEach((b, k) => { const on = b.ecu ? active.has("ecu") : active.has("rea"); if (on) { b.y += dt * b.s * 1.4; if (b.y > 2.25) b.y = .15; dm.position.set(b.x + Math.sin(t * 3 + k) * .05, b.y, b.z); dm.scale.setScalar(1); } else { dm.position.set(0, -50, 0); dm.scale.setScalar(0); } dm.updateMatrix(); bub.setMatrixAt(k, dm.matrix); });
  bub.instanceMatrix.needsUpdate = true;
  RW.forEach((w, k) => { w.o.position.y = w.base + (active.has("rea") ? Math.sin(t * 2.4 + k) * .03 : 0); });
  ecuW.position.y = 2.2 + (active.has("ecu") ? Math.sin(t * 2) * .04 : 0);
  if (ring.visible) { ring.scale.setScalar(STN[TOUR[Math.max(ti, 0)]?.s ?? 0].r * (1 + Math.sin(t * 4) * .04)); arrow.position.y = arrow.userData.y + Math.sin(t * 3) * .4; arrow.rotation.y += dt; }
  if (tourOn) { tT += dt; $("tBar").style.width = Math.min(100, tT / TD * 100) + "%"; if (tT >= TD) showStep(ti + 1); }
  // lecturas simuladas
  const tgt = run ? 10 + Math.sin(t * .4) * .6 : starting ? 4 : 0; q1 += (tgt - q1) * dt * .8;
  if (Math.floor(t * 4) !== Math.floor((t - dt) * 4)) {
    const f = v => v.toFixed(1).replace(".", ",");
    $("vQ1").textContent = f(q1) + " m³/h"; $("vQ4").textContent = f(active.has("cach") ? q1 * .8 : 0) + " m³/h";
    $("vL1").textContent = Math.round(run ? 48 + Math.sin(t * .3) * 8 : 62) + " %"; $("vL2").textContent = Math.round(run ? 60 + Math.sin(t * .2) * 6 : 55) + " %";
    $("vOD").textContent = f(active.has("rea") ? 2.1 + Math.sin(t * .5) * .3 : 0) + " mg/L"; $("vCl").textContent = f(active.has("tk") ? .8 + Math.sin(t * .35) * .1 : 0) + " mg/L";
    const d = new Date(); $("clk").innerHTML = d.toLocaleDateString("es-CL") + "<br>" + d.toLocaleTimeString("es-CL");
  }
  R.render(S, cam);
});
status(); L("HMI listo · planta en espera"); msg("Gira con un dedo, acerca con dos. START arranca la planta, STOP la detiene, INICIO hace el recorrido.", 7000);
}
